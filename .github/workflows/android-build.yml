name: Android Build

on:
  push:
    branches: [main, fix/multidevice-sync-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export source under validation
        run: git archive --format=zip --output=rondasafe-sources.zip HEAD

      - name: Upload validation source
        uses: actions/upload-artifact@v4
        with:
          name: rondasafe-validation-source
          path: rondasafe-sources.zip
          retention-days: 7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms"
          ls -1 "$ANDROID_HOME/build-tools"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rondasafe-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rondasafe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
