name: Sync Candidate Validation
on:
  push:
    branches: [fix/multidevice-release-072]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests, lint and packages
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify candidate identity and signature
        run: |
          set -euo pipefail
          mkdir -p package-info
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > package-info/signature.txt
          "$TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > package-info/package.txt
          "$TOOLS/aapt" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > package-info/manifest.txt
          ! grep -q 'E2eSyncReceiver' package-info/manifest.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > package-info/SHA256SUMS.txt
          git rev-parse HEAD > package-info/commit.txt
          git archive --format=zip HEAD -o package-info/source.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sync-candidate-packages
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-build-evidence
          path: |
            app/build/reports/
            app/build/test-results/
            package-info/
          retention-days: 14
  android-validation:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sync-candidate-packages
          path: apk
      - name: Boot two isolated Android clients
        timeout-minutes: 8
        run: bash scripts/qa/boot-android.sh
      - name: Regression suite on both Android clients
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p evidence
          for serial in emulator-5554 emulator-5556; do
            adb -s "$serial" install -r apk/debug/app-debug.apk
            adb -s "$serial" install -r apk/androidTest/debug/app-debug-androidTest.apk
            adb -s "$serial" shell am instrument -w com.rondasafe.app.test/androidx.test.runner.AndroidJUnitRunner | tee "evidence/${serial}-tests.txt"
            grep -Eq 'OK \([1-9][0-9]* tests?\)' "evidence/${serial}-tests.txt"
            ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' "evidence/${serial}-tests.txt"
          done
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          for serial in emulator-5554 emulator-5556; do
            timeout 10 adb -s "$serial" logcat -d -b crash > "evidence/${serial}-crash.txt" || true
          done
          cp /tmp/emulator*.log evidence/ 2>/dev/null || true
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-android-evidence
          path: evidence/
          retention-days: 14
      - name: Prepare tested candidate
        if: success()
        run: |
          mkdir -p delivery
          cp apk/debug/app-debug.apk delivery/RondaSafe-0.7.2-rc1.apk
          sha256sum delivery/RondaSafe-0.7.2-rc1.apk > delivery/SHA256SUMS.txt
          printf '%s\n' 'Candidate debug APK, not a production-signed release.' 'Tests used emulators, injected transport failures and read-only Supabase realtime.' 'Physical-device and live write end-to-end validation remain required.' > delivery/VALIDATION_SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RondaSafe-0.7.2-rc1-tested
          path: delivery/
          retention-days: 14
